[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-backend"
version = "1.0.0"
description = "DRIFT — News Provenance & Multilingual Claim Drift Intelligence Backend"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    # HTTP client
    "httpx>=0.27.0",
    # HTML parsing / scraping
    "beautifulsoup4>=4.12.0",
    "selectolax>=0.3.21",
    "lxml>=5.2.0",
    # News ingestion
    "feedparser>=6.0.11",
    # LLM
    "groq>=0.11.0",
    # Embeddings
    "sentence-transformers>=3.1.0",
    "numpy>=1.26.0",
    # Language detection
    "langdetect>=1.0.9",
    # Structured logging
    "structlog>=24.4.0",
    # Text utilities
    "python-dateutil>=2.9.0",
    "chardet>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
